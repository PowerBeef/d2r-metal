# Source checks and tool tests that need no game files (nothing from the game is in this repository, and CI has none):
# the string-table and switch checks, the scenario parser, the HUD-derivatives check, and the Python tool tests that build their own synthetic inputs.
# The host, graphics and iOS test suites need macOS 27 / Xcode 27.1 and partly the game's files, so they stay local (dm/verify/fork_gate.sh).
# Actions are pinned to commit SHAs (the tag in the comment).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source-and-tools:
    name: Source checks and tool tests (no game files)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Empty workspace
        # DM_ROOT points at an empty folder: tools that need game files report unavailable. Set here, not in the job's env,
        # where the runner context (runner.temp) does not exist yet and GitHub rejects the whole workflow file
        run: echo "DM_ROOT=$RUNNER_TEMP/dm-work" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements/tests.txt
      - name: Install the pinned packages
        run: python -m pip install -r .github/requirements/tests.txt
      - name: Source checks
        run: |
          python dm/i18n/scan_literals.py
          python dm/ios/tools/dm_i18n.py --check
          python dm/tools/switches.py check
          python dm/tools/enginemap.py check
          python dm/tools/scenario.py check dm/verify/scenarios/*.scn dm/verify/scenarios/saves/*.scn dm/verify/scenarios/faults/*.scn dm/verify/scenarios/picture/*.scn \
            dm/verify/scenarios/heap/*.scn dm/verify/scenarios/manual/*.scn dm/verify/golden/*.scn dm/verify/bench/*.scn
          bash -n dm/verify/fork_gate.sh && python dm/tools/gate_pick.py lint
          bash dm/ios/tools/check_hud_gen.sh
      - name: Release and install scripts
        # the launcher's release, packaging and install scripts parse, and shellcheck (on the runner image) finds no warning in them
        run: |
          for f in dm/tools/release_mac.sh dm/tools/launcher_app.sh dm/tools/extract_game.sh dm/tools/product.sh; do bash -n "$f"; done
          shellcheck -S warning dm/tools/release_mac.sh dm/tools/launcher_app.sh dm/tools/extract_game.sh dm/tools/product.sh
      - name: Tool tests
        # every tool test, by name pattern, so a new one runs here without being listed (test_mac_bundle skips itself off macOS)
        run: |
          failed=0
          for t in dm/tools/test_*.py dm/tools/re/test_*.py dm/verify/test_*.py dm/verify/touchcases/test_*.py; do
            echo "::group::$t"
            python "$t" || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
