<!doctype html>
<!-- D2R Metal brand art: the Runestone emblem (a forged-iron tile shaped like a silicon die, engraved with the Elder Futhark
     rune for M and filled with molten metal), the wordmark, the lockup and the app icon layers. Original artwork: no game art,
     no game fonts; the lettering is Cinzel (SIL OFL, fonts/). Each piece is shown alone by its #hash at its own size;
     render.sh screenshots every piece with headless Chrome at 2x and trims the transparent ones. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cinzel;src:url(fonts/Cinzel-wght.ttf) format("truetype");font-weight:400 900}
html,body{margin:0;background:transparent;overflow:hidden}
.piece{display:none;position:absolute;left:0;top:0}
.piece.on{display:block}
.wm{background:linear-gradient(180deg,#fff4d2 0%,#efca82 38%,#b98134 72%,#7a4a16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 1px rgba(30,12,4,.95)) drop-shadow(0 2px 0 #140804) drop-shadow(0 0 18px rgba(232,86,22,.38));
  font-family:Cinzel;font-weight:700;white-space:nowrap;line-height:1;font-feature-settings:"liga" 0}
#wordmark .wm{position:absolute;left:30px;top:24px;font-size:96px;letter-spacing:.14em}
#lockup .wm{font-size:78px;letter-spacing:.14em}
.cap{font-family:Cinzel;font-weight:600;letter-spacing:.34em;color:#c8a873;text-shadow:0 1px 2px #000;white-space:nowrap}
.rule{display:flex;align-items:center;gap:14px}
.rule i{display:block;height:1.5px;flex:1;background:linear-gradient(90deg,rgba(160,118,56,0),#a07638)}
.rule i:last-child{background:linear-gradient(90deg,#a07638,rgba(160,118,56,0))}
.rule b{display:block;width:10px;height:10px;background:linear-gradient(135deg,#ffe2a0,#c08a3e);transform:rotate(45deg);box-shadow:0 0 10px #ff8a2a}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eccb86"/><stop offset=".3" stop-color="#a8793c"/><stop offset=".62" stop-color="#5f3e1c"/><stop offset="1" stop-color="#2a190a"/></linearGradient>
 <linearGradient id="bronzeR" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="310"><stop offset="0" stop-color="#d9b06a"/><stop offset=".45" stop-color="#8c6130"/><stop offset="1" stop-color="#3e260f"/></linearGradient>
 <linearGradient id="molten" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="300"><stop offset="0" stop-color="#ffe7a8"/><stop offset=".22" stop-color="#ffb04a"/><stop offset=".52" stop-color="#ff7a1f"/><stop offset=".82" stop-color="#d63a0b"/><stop offset="1" stop-color="#861b05"/></linearGradient>
 <radialGradient id="iron" cx=".3" cy=".25" r="1"><stop offset="0" stop-color="#463a33"/><stop offset=".5" stop-color="#231b18"/><stop offset="1" stop-color="#0e0a09"/></radialGradient>
 <radialGradient id="underglow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#ff6a1c" stop-opacity=".34"/><stop offset=".6" stop-color="#c2360c" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <radialGradient id="vignette" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></radialGradient>
 <filter id="bevel" x="-15%" y="-15%" width="130%" height="130%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
  <feSpecularLighting in="b" surfaceScale="4" specularConstant=".9" specularExponent="24" lighting-color="#ffe8b8" result="s"><feDistantLight azimuth="225" elevation="38"/></feSpecularLighting>
  <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
  <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0"/></filter>
 <filter id="lip" x="-25%" y="-25%" width="150%" height="150%">
  <feMorphology in="SourceGraphic" operator="dilate" radius="4.2" result="d"/>
  <feGaussianBlur in="d" stdDeviation="1.3" result="b"/>
  <feSpecularLighting in="b" surfaceScale="3.5" specularConstant="1.1" specularExponent="22" lighting-color="#fff2cc" result="s"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
  <feComposite in="s" in2="d" operator="in" result="s2"/>
  <feComposite in="d" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0"/></filter>
 <filter id="channel" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceGraphic" operator="dilate" radius="2.4"/></filter>
 <filter id="core" x="-25%" y="-25%" width="150%" height="150%"><feMorphology in="SourceGraphic" operator="erode" radius="9.5"/><feGaussianBlur stdDeviation="2.4"/></filter>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11"/></filter>
 <filter id="hammer" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".032" numOctaves="3" seed="11" result="t"/>
  <feDiffuseLighting in="t" surfaceScale="3" diffuseConstant="1.15" lighting-color="#fff" result="l"><feDistantLight azimuth="225" elevation="58"/></feDiffuseLighting>
  <feComposite in="l" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="m"/>
  <feComposite in="m" in2="SourceAlpha" operator="in"/></filter>
 <filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .62  0 0 0 0 .54  0 0 0 0 .48  0 0 0 .5 -.2" result="c"/>
  <feComposite in="c" in2="SourceAlpha" operator="in"/></filter>
 <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity=".75"/></filter>

 <!-- the rune ᛗ as two blade-tipped staves joined by a cross; polygons are filled, lines stroked, both by the <use>'s paint -->
 <symbol id="rune" viewBox="0 0 400 400" overflow="visible">
  <polygon points="137,112 163,112 163,262 150,298 137,262" stroke="none"/>
  <polygon points="237,112 263,112 263,262 250,298 237,262" stroke="none"/>
  <line x1="150" y1="121" x2="250" y2="217" stroke-width="24"/>
  <line x1="250" y1="121" x2="150" y2="217" stroke-width="24"/>
 </symbol>
 <!-- the molten rune inlaid in a bronze-lipped channel (400 grid) -->
 <symbol id="inlay" viewBox="0 0 400 400" overflow="visible">
  <use href="#rune" fill="url(#bronzeR)" stroke="url(#bronzeR)" filter="url(#lip)"/>
  <use href="#rune" fill="#160704" stroke="#160704" filter="url(#channel)"/>
  <use href="#rune" fill="#ff560f" stroke="#ff560f" filter="url(#glow)" opacity=".85"/>
  <use href="#rune" fill="url(#molten)" stroke="url(#molten)"/>
  <use href="#rune" fill="#fff4cf" stroke="#fff4cf" filter="url(#core)" opacity=".62"/>
 </symbol>
 <symbol id="studs" viewBox="0 0 400 400">
  <g fill="url(#bronze)" filter="url(#bevel)">
   <rect x="114" y="36" width="22" height="30" rx="4"/><rect x="164" y="36" width="22" height="30" rx="4"/><rect x="214" y="36" width="22" height="30" rx="4"/><rect x="264" y="36" width="22" height="30" rx="4"/>
   <rect x="114" y="334" width="22" height="30" rx="4"/><rect x="164" y="334" width="22" height="30" rx="4"/><rect x="214" y="334" width="22" height="30" rx="4"/><rect x="264" y="334" width="22" height="30" rx="4"/>
   <rect x="36" y="114" width="30" height="22" rx="4"/><rect x="36" y="164" width="30" height="22" rx="4"/><rect x="36" y="214" width="30" height="22" rx="4"/><rect x="36" y="264" width="30" height="22" rx="4"/>
   <rect x="334" y="114" width="30" height="22" rx="4"/><rect x="334" y="164" width="30" height="22" rx="4"/><rect x="334" y="214" width="30" height="22" rx="4"/><rect x="334" y="264" width="30" height="22" rx="4"/>
  </g>
 </symbol>
 <!-- the whole emblem (400 grid): studs, the iron tile with its bronze rim, the inlaid rune -->
 <symbol id="emblem-art" viewBox="0 0 400 400" overflow="visible">
  <use href="#studs"/>
  <rect x="58" y="58" width="284" height="284" rx="52" fill="#060303" filter="url(#drop)"/>
  <rect x="60" y="60" width="280" height="280" rx="50" fill="url(#iron)" filter="url(#hammer)"/>
  <rect x="60" y="60" width="280" height="280" rx="50" fill="#000" filter="url(#grain)" opacity=".35"/>
  <rect x="60" y="60" width="280" height="280" rx="50" fill="url(#underglow)"/>
  <rect x="60" y="60" width="280" height="280" rx="50" fill="url(#vignette)"/>
  <rect x="60" y="60" width="280" height="280" rx="50" fill="none" stroke="url(#bronze)" stroke-width="7" filter="url(#bevel)"/>
  <rect x="83" y="83" width="234" height="234" rx="30" fill="none" stroke="#9a6f35" stroke-opacity=".45" stroke-width="1.6"/>
  <use href="#inlay" x="0" y="-4" width="400" height="400"/>
 </symbol>
</defs></svg>

<!-- 512 x 512 (1024 px): the emblem alone, transparent -->
<div class="piece" id="emblem" style="width:512px;height:512px"><svg width="512" height="512" viewBox="0 0 400 400"><use href="#emblem-art"/></svg></div>

<!-- the wordmark, transparent (trimmed after rendering) -->
<div class="piece" id="wordmark" style="width:760px;height:150px"><div class="wm">D2R METAL</div></div>

<!-- the horizontal lockup: emblem, wordmark, rule and tagline -->
<div class="piece" id="lockup" style="width:1000px;height:330px">
 <svg width="300" height="300" viewBox="0 0 400 400" style="position:absolute;left:10px;top:15px"><use href="#emblem-art"/></svg>
 <div style="position:absolute;left:330px;top:86px;width:640px;display:flex;flex-direction:column;gap:20px">
  <div class="wm" style="padding-left:4px">D2R METAL</div>
  <div class="rule" style="width:560px"><i></i><b></b><i></i></div>
  <div class="cap" style="font-size:19px;padding-left:6px">Native on Apple silicon</div>
 </div>
</div>

<!-- app icon layers on the 1024 canvas (512 CSS px at 2x); the system cuts the rounded shape and adds the glass -->
<div class="piece" id="icon-iron" style="width:512px;height:512px"><svg width="512" height="512" viewBox="0 0 1024 1024">
 <rect width="1024" height="1024" fill="url(#iron)" filter="url(#hammer)"/>
 <rect width="1024" height="1024" fill="#000" filter="url(#grain)" opacity=".3"/>
 <circle cx="512" cy="540" r="470" fill="url(#underglow)"/>
 <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg></div>
<div class="piece" id="icon-frame" style="width:512px;height:512px"><svg width="512" height="512" viewBox="0 0 1024 1024">
 <g transform="translate(-0 0)">
  <rect x="120" y="120" width="784" height="784" rx="150" fill="none" stroke="url(#bronze)" stroke-width="30" filter="url(#bevel)"/>
  <rect x="172" y="172" width="680" height="680" rx="100" fill="none" stroke="#9a6f35" stroke-opacity=".5" stroke-width="4"/>
  <g fill="url(#bronze)" filter="url(#bevel)">
   <rect x="312" y="62" width="50" height="62" rx="9"/><rect x="430" y="62" width="50" height="62" rx="9"/><rect x="544" y="62" width="50" height="62" rx="9"/><rect x="662" y="62" width="50" height="62" rx="9"/>
   <rect x="312" y="900" width="50" height="62" rx="9"/><rect x="430" y="900" width="50" height="62" rx="9"/><rect x="544" y="900" width="50" height="62" rx="9"/><rect x="662" y="900" width="50" height="62" rx="9"/>
   <rect x="62" y="312" width="62" height="50" rx="9"/><rect x="62" y="430" width="62" height="50" rx="9"/><rect x="62" y="544" width="62" height="50" rx="9"/><rect x="62" y="662" width="62" height="50" rx="9"/>
   <rect x="900" y="312" width="62" height="50" rx="9"/><rect x="900" y="430" width="62" height="50" rx="9"/><rect x="900" y="544" width="62" height="50" rx="9"/><rect x="900" y="662" width="62" height="50" rx="9"/>
  </g>
 </g>
</svg></div>
<div class="piece" id="icon-rune" style="width:512px;height:512px"><svg width="512" height="512" viewBox="0 0 1024 1024">
 <use href="#inlay" x="12" y="8" width="1000" height="1000"/>
</svg></div>
<!-- the three layers flattened: the iPhone icon and the .icns fallback -->
<div class="piece" id="icon-flat" style="width:512px;height:512px"><svg width="512" height="512" viewBox="0 0 1024 1024">
 <rect width="1024" height="1024" fill="url(#iron)" filter="url(#hammer)"/>
 <rect width="1024" height="1024" fill="#000" filter="url(#grain)" opacity=".3"/>
 <circle cx="512" cy="540" r="470" fill="url(#underglow)"/>
 <rect width="1024" height="1024" fill="url(#vignette)"/>
 <rect x="120" y="120" width="784" height="784" rx="150" fill="none" stroke="url(#bronze)" stroke-width="30" filter="url(#bevel)"/>
 <rect x="172" y="172" width="680" height="680" rx="100" fill="none" stroke="#9a6f35" stroke-opacity=".5" stroke-width="4"/>
 <g fill="url(#bronze)" filter="url(#bevel)">
  <rect x="312" y="62" width="50" height="62" rx="9"/><rect x="430" y="62" width="50" height="62" rx="9"/><rect x="544" y="62" width="50" height="62" rx="9"/><rect x="662" y="62" width="50" height="62" rx="9"/>
  <rect x="312" y="900" width="50" height="62" rx="9"/><rect x="430" y="900" width="50" height="62" rx="9"/><rect x="544" y="900" width="50" height="62" rx="9"/><rect x="662" y="900" width="50" height="62" rx="9"/>
  <rect x="62" y="312" width="62" height="50" rx="9"/><rect x="62" y="430" width="62" height="50" rx="9"/><rect x="62" y="544" width="62" height="50" rx="9"/><rect x="62" y="662" width="62" height="50" rx="9"/>
  <rect x="900" y="312" width="62" height="50" rx="9"/><rect x="900" y="430" width="62" height="50" rx="9"/><rect x="900" y="544" width="62" height="50" rx="9"/><rect x="900" y="662" width="62" height="50" rx="9"/>
 </g>
 <use href="#inlay" x="12" y="8" width="1000" height="1000"/>
</svg></div>
<script>document.getElementById(location.hash.slice(1) || 'emblem').classList.add('on')</script>
</body></html>
